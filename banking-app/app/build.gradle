plugins { id "com.android.application" }

android {
    namespace "de.konzept.banking"
    compileSdk 34
    defaultConfig {
        applicationId "de.konzept.banking"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    signingConfigs {
        // Fester Schluessel nur fuer dieses Konzept-Projekt, damit Updates ueber die alte Version installieren
        konzept {
            storeFile file("../keystore/konzept.jks")
            storePassword "konzept123"
            keyAlias "konzept"
            keyPassword "konzept123"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.konzept }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
