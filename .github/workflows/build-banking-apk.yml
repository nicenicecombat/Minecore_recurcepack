name: Build Banking Konzept APK

on:
  push:
    branches: [ccr-198fccf3-vj6jk0]
    paths:
      - "banking-app/**"
      - ".github/workflows/build-banking-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p banking-app :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp banking-app/app/build/outputs/apk/debug/app-debug.apk Banking-Konzept.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Banking-Konzept-APK
          path: Banking-Konzept.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: banking-konzept-${{ github.run_number }}
          name: Banking Konzept ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Banking-Konzept.apk
